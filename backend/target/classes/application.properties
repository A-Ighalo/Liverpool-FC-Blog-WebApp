# Application Configuration
spring.application.name=liverpool-fc-blog-webapp

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/liverpool_fc_db
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
app.jwt.secret=liverpoolFCSecretKey2024ForJWTTokenGeneration
app.jwt.expiration=86400000

# Server Configuration
server.port=8080

# CORS Configuration
app.cors.allowed-origins=http://localhost:4200,https://your-frontend-domain.com

# Logging
logging.level.com.liverpoolfc.blogwebapp=DEBUG
logging.level.org.springframework.security=DEBUG