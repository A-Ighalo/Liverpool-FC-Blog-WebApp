# Production Configuration for AWS Deployment
spring.application.name=liverpool-fc-blog-webapp

# Database Configuration (PostgreSQL on AWS RDS)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/liverpool_fc_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# JWT Configuration
app.jwt.secret=${JWT_SECRET:liverpoolFCSecretKey2024ForJWTTokenGeneration}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# Server Configuration
server.port=${PORT:5000}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://your-frontend-domain.com,https://your-cloudfront-url.cloudfront.net}

# Logging
logging.level.com.liverpoolfc.blogwebapp=INFO
logging.level.root=WARN