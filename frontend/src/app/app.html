<nav class="navbar">
  <div class="nav-container">
    <a routerLink="/" class="nav-logo">
      <span>⚽ Liverpool FC Hub</span>
    </a>
    
    <div class="nav-menu">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link">Home</a>
      <a routerLink="/blog" routerLinkActive="active" class="nav-link">Blog</a>
      <a routerLink="/stats" routerLinkActive="active" class="nav-link">Stats</a>
      <a routerLink="/admin" routerLinkActive="active" class="nav-link" *ngIf="authService.isAdmin()">Admin</a>
    </div>

    <div class="nav-auth">
      <div *ngIf="authService.isLoggedIn(); else notLoggedIn" class="auth-section">
        <span class="welcome-text">Welcome, {{ authService.getUser().username }}</span>
        <button (click)="logout()" class="btn btn-outline">Logout</button>
      </div>
      <ng-template #notLoggedIn>
        <a routerLink="/login" class="btn btn-primary">Login</a>
      </ng-template>
    </div>
  </div>
</nav>

<main class="main-content">
  <router-outlet></router-outlet>
</main>

<footer class="footer">
  <div class="footer-content">
    <p>&copy; 2024 Liverpool FC Hub. You'll Never Walk Alone.</p>
  </div>
</footer>
